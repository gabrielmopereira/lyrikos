packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  fallow: true
  msw: true
  prisma: true
  sharp: true
  vue-demi: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - fallow
  - prisma
  - sharp
  - unrs-resolver
